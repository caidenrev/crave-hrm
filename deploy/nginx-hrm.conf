# ==============================================================================
# Nginx Server Configuration for Crave HRM
# Domain: hrm.craveservices.my.id
# Target Root: /var/www/crave-hrm/public
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hrm.craveservices.my.id;

    # Root Directory to Laravel Public Folder
    root /var/www/crave-hrm/public;
    index index.php index.html index.htm;

    # Maximum upload size for CV/Resume files and selfie attendance
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/crave_hrm_access.log;
    error_log /var/log/nginx/crave_hrm_error.log error;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Main Location Directive
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite Static Build Assets Caching (Immutable 1 Year)
    location ~* ^/build/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded Storage Files (Resumes, Photos)
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM Handler (PHP 8.3)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
